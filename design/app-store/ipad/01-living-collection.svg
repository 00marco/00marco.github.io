  <g id="Copy"><text x="118" y="176" fill="#A8B99B" font-family="Arial, sans-serif" font-size="34" letter-spacing="10">THE PRIVATE GARDEN</text><text x="106" y="426" fill="#F4F1E9" font-family="Georgia, serif" font-size="102" letter-spacing="-4"><tspan x="106">Your ideas,</tspan><tspan x="106" dy="112">arranged like</tspan><tspan x="106" dy="112" fill="#B8C4A8" font-style="italic">a living</tspan><tspan x="106" dy="112" fill="#B8C4A8" font-style="italic">collection.</tspan></text><text x="116" y="1010" fill="#AAB2AC" font-family="Arial, sans-serif" font-size="34"><tspan x="116">Step back when you need</tspan><tspan x="116" dy="54">perspective. Move closer when</tspan><tspan x="116" dy="54">one thought calls.</tspan></text></g>
